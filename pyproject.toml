[project]
name = "weather-ai-antigravity"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kaleem Khan", email = "itsaksquare@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
weather-ai-antigravity = "weather_ai_antigravity:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
